operator:
  replicas: 1
  rollOutPods: true
  prometheus:
    metricsService: true
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: monitoring

rollOutCiliumPods: true

hubble:
  relay:
    enabled: false
  ui:
    enabled: false

ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.0.0.0/16
    clusterPoolIPv4MaskSize: 24

cni:
  install: true
  exclusive: true

devices: eno1

prometheus:
  enabled: true
  metricsService: true
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring

envoy:
  prometheus:
    serviceMonitor:
      enabled: true
      interval: 30s
      labels:
        release: monitoring

kubeProxyReplacement: true
k8sServiceHost: 192.168.0.100
k8sServicePort: 6443

nodePort:
  addresses:
    - 192.168.0.100/32

l2announcements:
  enabled: true

ingressController:
  enabled: true
  default: true
  loadbalancerMode: shared

global:
  domain: argocd.navy1634.com

configs:
  cm:
    admin.enabled: false
    url: https://argocd.navy1634.com
    oidc.config: |
      name: Google
      issuer: https://accounts.google.com
      clientID: $argocd-google-oauth:GOOGLE_CLIENT_ID
      clientSecret: $argocd-google-oauth:GOOGLE_CLIENT_SECRET
      requestedScopes: [openid, profile, email]
      enablePKCEAuthentication: true
  cmp:
    create: true
    plugins:
      helmfile:
        generate:
          command: [sh, -c]
          args:
            - >-
              exec env ENVIRONMENT="${ARGOCD_ENV_ENVIRONMENT}"
              helmfile template --quiet --no-color --template-args=--include-crds
  params:
    server.insecure: true
  rbac:
    policy.default: role:authenticated
    scopes: '[email]'
dex:
  enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: cilium
    extraTls:
      - hosts:
          - argocd.navy1634.com
        secretName: argocd-tls
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
applicationSet:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

notifications:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring

repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: monitoring
  extraContainers:
    - name: cmp-helmfile
      command:
        - /var/run/argocd/argocd-cmp-server
      image: ghcr.io/helmfile/helmfile:v1.8.3
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      env:
        - name: HOME
          value: /tmp
        - name: HELM_CACHE_HOME
          value: /tmp/.cache/helm
        - name: HELM_CONFIG_HOME
          value: /tmp/.config/helm
        - name: HELM_DATA_HOME
          value: /tmp/.local/share/helm
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: helmfile.yaml
          readOnly: true
        - name: cmp-tmp
          mountPath: /tmp
  volumes:
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    - name: cmp-tmp
      emptyDir: {}

apiVersion: v1
kind: Service
metadata:
  name: tailscale-dns
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tailscale-dns
spec:
  type: ClusterIP
  clusterIP: {{ .Values.dns.service.clusterIP | quote }}
  selector:
    app.kubernetes.io/name: tailscale-dns
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp

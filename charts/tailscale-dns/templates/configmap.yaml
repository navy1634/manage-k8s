apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-dns
  labels:
    app.kubernetes.io/name: tailscale-dns
data:
  Corefile: |
    navy1634.com:53 {
      errors
      health :8080
      ready :8181
      hosts {
{{- range .Values.dns.ingress.hosts }}
        {{ $.Values.dns.ingress.clusterIP }} {{ . }}
{{- end }}
      }
      cache 30
    }

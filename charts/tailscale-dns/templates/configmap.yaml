apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-dns
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: tailscale-dns
data:
  Corefile: |
    {{ range .Values.dns.zones }}{{ .domain }}:53 {{ end }}{
      errors
      health :8080
      ready :8181
      hosts {
{{- range .Values.dns.zones }}
{{- range .records }}
        {{ .ip }} {{ .name }}
{{- end }}
{{- end }}
      }
      cache 30
    }
